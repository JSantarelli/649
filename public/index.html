<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./assets/icons.css" />
  <title>649</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #2c3e50;
      width: 100vw;
      height: 100vh;
    }
    
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      z-index: 1000;
    }
    
    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 1000;
    }
  </style>
</head> 
<body>
  
  <section id="map">
    <span class="overlay"></span>
  </section>

   <!-- Fuerzas -->
    <div class="dataset-section">
      <h4>Datasets</h4>
        <div class="dataset-container armada" data-key="armada">
            <div class="dataset-toggle active" data-toggle="armada"></div>
            <div class="progress-container">
                <div class="dataset-label">Armada</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 0%"></div>
                    <div class="progress-text">0/0</div>
                </div>
            </div>
        </div>
       <div class="dataset-container ea" data-key="ea">
            <div class="dataset-toggle active" data-toggle="ea"></div>
            <div class="progress-container">
                <div class="dataset-label">Ejército Argentino</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 0%"></div>
                    <div class="progress-text">0/0</div>
                </div>
            </div>
        </div>

        <div class="dataset-container ffa" data-key="ffa">
            <div class="dataset-toggle active" data-toggle="ffa"></div>
            <div class="progress-container">
                <div class="dataset-label">Fuerza Aérea</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 0%"></div>
                    <div class="progress-text">0/0</div>
                </div>
            </div>
        </div>

        <div class="dataset-container gna" data-key="gna">
            <div class="dataset-toggle active" data-toggle="gna"></div>
            <div class="progress-container">
                <div class="dataset-label">Gendarmería</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 0%"></div>
                    <div class="progress-text">0/0</div>
                </div>
            </div>
        </div>

        <div class="dataset-container pna" data-key="pna">
            <div class="dataset-toggle active" data-toggle="pna"></div>
            <div class="progress-container">
                <div class="dataset-label">Prefectura</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 0%"></div>
                    <div class="progress-text">0/0</div>
                </div>
            </div>
        </div>

        <div class="dataset-container pnc" data-key="pnc">
            <div class="dataset-toggle active" data-toggle="pnc"></div>
            <div class="progress-container">
                <div class="dataset-label">Continente</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 0%"></div>
                    <div class="progress-text">0/0</div>
                </div>
            </div>
        </div>

           <!-- NEW: Escalafón Progress Bars Section -->
      <div class="escalafone-section">
          <h4>Distribución por Escalafón</h4>
          <div id="escalafone-container">
              <div class="escalafone-no-data">Cargando datos de escalafón...</div>
          </div>
      </div>

      <div id="total-count">Total visible: 0/0</div>
    </div>
        
  <!-- Fechas -->
  <div class="date-section">
    <!-- <h4>Filtro por Fecha de Deceso</h4> -->
    
    <div class="date-container">
      <label class="date-label">
        Desde: <span id="start-date-value" class="start-date-value">02/04/1982</span>
      </label>
      <input type="range" class="date-slider" id="start-date-slider" min="0" max="73" value="0">
    </div>
    
    <div class="date-container">
      <label class="date-label">
        Hasta: <span id="end-date-value" class="end-date-value">08/07/1982</span>
      </label>
      <input type="range" class="date-slider" id="end-date-slider" min="0" max="73" value="73">
    </div>
  </div>

  <!-- Main UI Panel -->
  <div class="main-ui" id="main-ui">
    <h3>Fallecidos en Malvinas</h3>
  </div>
    <!-- Age Statistics Section -->
    <div class="age-section">
      <div id="average-age-display">
        <div class="age-average" id="age-average">
          Promedio de Edad: <span id="average-value">--</span> años
        </div>
      </div>
    </div>


  <!-- Events Panel -->
  <div id="events-panel">
    <h3>Eventos Bélicos</h3>
    <div id="events-container">
      <div class="events-no-data">Cargando eventos...</div>
    </div>
  </div>

  <!-- Mobile Toggle Buttons -->
  <button class="panel-toggle" id="toggle-main-ui" style="display: none;">Panel Principal</button>
  <button class="panel-toggle" id="toggle-events" style="display: none;">Eventos</button>

  <!-- Tooltip -->
  <div class="tooltip" id="tooltip"></div>

  <script src="/bundle.js"></script>
</body>
</html>
